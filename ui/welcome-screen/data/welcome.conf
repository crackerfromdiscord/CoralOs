# CoralOS welcome screen settings.
#
# Layering (later wins):
#   <prefix>/share/coralos/welcome.conf   shipped defaults (this file)
#   /etc/coralos/welcome.conf             system-wide overrides
#   ~/.config/coralos/welcome.conf        per-user overrides (CoralOS Settings)
#
# Every key is optional; anything left out uses the built-in default.

[welcome]
# Set to false to turn the welcome screen off (system-wide or per user).
enabled = true

# Placeholders: {name} {username} {real_name} {first_name}
greeting = Welcome, {name}
# What {name} means: real_name | first_name | username
name_source = real_name

# Profile picture. Empty = AccountsService icon (Settings > Users), then ~/.face,
# then generated initials.
avatar =
avatar_size = 168

accent_color = #FF7A66
background_color = #0B0F14
text_color = #F2F4F7
show_branding = true
branding_text = CoralOS

# Timing (milliseconds)
min_display_ms = 1400
max_wait_ms = 20000
settle_ms = 500
complete_ms = 450
check_ms = 450
success_hold_ms = 900
fade_ms = 700

# What "desktop loaded" means. Probes that do not exist on this system are skipped.
wait_for_gnome_session = true
wait_for_bus_names = org.gnome.Shell
wait_for_units = graphical-session.target

# Esc / Enter / Space / click skips straight to the checkmark.
allow_skip = true
# Cover every monitor (true) or only the first one (false).
all_monitors = true
